[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfeng"
version = "0.1.0"
description = "GT-FENG (General Theory of Factual Evaluation and Normative Grounding): evaluate language-model answers about rule-governed facts"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jiayu Feng" }]
dependencies = ["pandas>=1.5"]
keywords = ["language models", "evaluation", "factuality", "law", "policy", "temporal", "jurisdiction"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
where = ["src"]
